# API gateway: one public entry point (port 8080) that routes /api/<resource>
# to the microservice that owns that resource. Services resolve by their
# docker-compose service name on the shared network.
server {
    listen 80;

    location /api/students      { proxy_pass http://student-profile:5001/students; }
    location /api/courses       { proxy_pass http://course-catalogue:5002/courses; }
    location /api/feedback      { proxy_pass http://feedback:5003/feedback; }
    location /api/notifications { proxy_pass http://notification:5004/notifications; }

    location = /health { return 200 '{"service":"gateway","status":"ok"}'; default_type application/json; }
}
